<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alarm Man & Screen Trap</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Full-screen trap jaws overlay -->
  <div id="screenTrap" class="screen-trap" aria-hidden="true">
    <div class="trap-jaw trap-jaw-top">
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span>
    </div>
    <div class="trap-jaw trap-jaw-bottom">
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span>
    </div>
    <div class="trap-flash"></div>
    <p class="trap-gotcha">GOTCHA!</p>
  </div>

  <main class="page">
    <section class="stage">
      <header class="header">
        <h1>Alarm Man</h1>
        <p>Click him to ring the alarm!</p>
      </header>

      <button id="alarmMan" class="alarm-man" type="button" aria-label="Ring Alarm Man">
        <span class="bell bell-left" aria-hidden="true"></span>
        <span class="bell bell-right" aria-hidden="true"></span>
        <span class="hammer" aria-hidden="true"></span>

        <span class="clock-body" aria-hidden="true">
          <span class="face">
            <span class="eye eye-left"></span>
            <span class="eye eye-right"></span>
            <span class="mouth"></span>
            <span class="hand hour"></span>
            <span class="hand minute"></span>
            <span class="center-dot"></span>
          </span>
        </span>

        <span class="arm arm-left" aria-hidden="true">
          <span class="hand-shape"></span>
        </span>
        <span class="arm arm-right" aria-hidden="true">
          <span class="hand-shape"></span>
        </span>

        <span class="leg leg-left" aria-hidden="true">
          <span class="foot"></span>
        </span>
        <span class="leg leg-right" aria-hidden="true">
          <span class="foot"></span>
        </span>
      </button>

      <div class="controls">
        <button id="ringBtn" class="btn" type="button">Ring!</button>
        <button id="snoozeBtn" class="btn btn-secondary" type="button">Snooze</button>
      </div>

      <p id="status" class="status" aria-live="polite">zzz… sleeping</p>
    </section>

    <section class="stage trap-stage">
      <header class="header">
        <h1>Screen Trap</h1>
        <p>Click the trap — jaws snap shut on the display!</p>
      </header>

      <button id="bearTrap" class="bear-trap" type="button" aria-label="Spring the trap">
        <span class="bt-base" aria-hidden="true"></span>
        <span class="bt-spring" aria-hidden="true"></span>
        <span class="bt-plate" aria-hidden="true"></span>
        <span class="bt-jaw bt-jaw-left" aria-hidden="true">
          <span class="bt-tooth"></span><span class="bt-tooth"></span>
          <span class="bt-tooth"></span><span class="bt-tooth"></span>
          <span class="bt-tooth"></span>
        </span>
        <span class="bt-jaw bt-jaw-right" aria-hidden="true">
          <span class="bt-tooth"></span><span class="bt-tooth"></span>
          <span class="bt-tooth"></span><span class="bt-tooth"></span>
          <span class="bt-tooth"></span>
        </span>
        <span class="bt-bait" aria-hidden="true">🧀</span>
      </button>

      <div class="controls">
        <button id="snapBtn" class="btn btn-danger" type="button">SNAP!</button>
        <button id="resetTrapBtn" class="btn btn-secondary" type="button">Reset</button>
      </div>

      <p id="trapStatus" class="status" aria-live="polite">Trap is set… waiting…</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
