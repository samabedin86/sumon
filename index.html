<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam AI — Roaming Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="roam-world">
  <!-- Atmosphere only — no full-page stages -->
  <div class="sky" aria-hidden="true">
    <span class="drift drift-a"></span>
    <span class="drift drift-b"></span>
    <span class="drift drift-c"></span>
  </div>

  <p class="roam-hint" id="roamHint">Sam AI wanders the display — click or drag the character to chat</p>

  <!-- Hidden toys kept for agent commands (ring / snap) -->
  <div class="offstage" aria-hidden="true">
    <button id="alarmMan" class="alarm-man" type="button" tabindex="-1">
      <span class="bell bell-left"></span><span class="bell bell-right"></span>
      <span class="hammer"></span>
      <span class="clock-body"><span class="face">
        <span class="eye eye-left"></span><span class="eye eye-right"></span>
        <span class="mouth"></span><span class="hand hour"></span><span class="hand minute"></span>
        <span class="center-dot"></span>
      </span></span>
      <span class="arm arm-left"><span class="hand-shape"></span></span>
      <span class="arm arm-right"><span class="hand-shape"></span></span>
      <span class="leg leg-left"><span class="foot"></span></span>
      <span class="leg leg-right"><span class="foot"></span></span>
    </button>
    <button id="ringBtn" type="button"></button>
    <button id="snoozeBtn" type="button"></button>
    <p id="status"></p>

    <button id="bearTrap" class="bear-trap set" type="button" tabindex="-1">
      <span class="bt-base"></span><span class="bt-spring"></span><span class="bt-plate"></span>
      <span class="bt-jaw bt-jaw-left"><span class="bt-tooth"></span><span class="bt-tooth"></span><span class="bt-tooth"></span><span class="bt-tooth"></span><span class="bt-tooth"></span></span>
      <span class="bt-jaw bt-jaw-right"><span class="bt-tooth"></span><span class="bt-tooth"></span><span class="bt-tooth"></span><span class="bt-tooth"></span><span class="bt-tooth"></span></span>
      <span class="bt-bait">🧀</span>
    </button>
    <button id="snapBtn" type="button"></button>
    <button id="resetTrapBtn" type="button"></button>
    <p id="trapStatus"></p>
  </div>

  <div id="screenTrap" class="screen-trap" aria-hidden="true">
    <div class="trap-jaw trap-jaw-top">
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span>
    </div>
    <div class="trap-jaw trap-jaw-bottom">
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span><span class="tooth"></span>
      <span class="tooth"></span><span class="tooth"></span>
    </div>
    <div class="trap-flash"></div>
    <p class="trap-gotcha">GOTCHA!</p>
  </div>

  <!-- Roaming Sam AI character -->
  <button id="samRoamer" class="sam-roamer" type="button" aria-label="Sam AI — click to chat, drag to move">
    <span class="sam-shadow" aria-hidden="true"></span>
    <span class="sam-body" aria-hidden="true">
      <span class="agent-aura"></span>
      <span class="agent-core">
        <span class="agent-eye agent-eye-left"></span>
        <span class="agent-eye agent-eye-right"></span>
        <span class="agent-mouth"></span>
      </span>
      <span class="agent-antenna"></span>
      <span class="sam-leg sam-leg-l"></span>
      <span class="sam-leg sam-leg-r"></span>
    </span>
    <span class="sam-name">Sam AI</span>
    <span id="samBubble" class="sam-bubble" hidden></span>
  </button>

  <!-- Keep ids agent code expects -->
  <button id="agentFigure" class="visually-hidden" type="button" tabindex="-1" aria-hidden="true"></button>
  <ul id="missionBoard" class="visually-hidden" aria-hidden="true"></ul>
  <button id="openAgentBtn" class="visually-hidden" type="button" tabindex="-1" aria-hidden="true"></button>
  <button id="clearAgentMemoryBtn" class="visually-hidden" type="button" tabindex="-1" aria-hidden="true"></button>
  <p id="agentStatus" class="visually-hidden" aria-live="polite"></p>

  <div id="focusHud" class="focus-hud" aria-live="polite"></div>

  <button id="agentLauncher" class="agent-launcher" type="button" aria-label="Open Sam AI chat" aria-expanded="false" aria-controls="agentPanel">
    <span class="launcher-orb" aria-hidden="true"></span>
    <span class="launcher-label">Chat</span>
  </button>

  <aside id="agentPanel" class="agent-panel" aria-hidden="true" aria-label="Sam AI chat">
    <header class="agent-panel-header">
      <div>
        <p class="agent-panel-kicker">Roaming companion</p>
        <h2>Sam AI</h2>
      </div>
      <button id="agentClose" class="agent-close" type="button" aria-label="Close chat">×</button>
    </header>
    <div id="agentMessages" class="agent-messages" role="log" aria-live="polite"></div>
    <div class="agent-chips" role="group" aria-label="Quick actions">
      <button type="button" class="agent-chip" data-prompt="brief">Brief</button>
      <button type="button" class="agent-chip" data-prompt="act">Act</button>
      <button type="button" class="agent-chip" data-prompt="profile">Profile</button>
      <button type="button" class="agent-chip" id="focusChip" data-prompt="focus 25">Focus 25</button>
      <button type="button" class="agent-chip" data-prompt="talk on">Talk</button>
      <button type="button" class="agent-chip" data-prompt="help">Help</button>
    </div>
    <form id="agentForm" class="agent-form">
      <button id="agentMic" class="agent-mic" type="button" aria-label="Speak to Sam AI" aria-pressed="false" title="Click to talk">Mic</button>
      <label class="visually-hidden" for="agentInput">Message Sam AI</label>
      <input id="agentInput" type="text" autocomplete="off" placeholder="Chat freely · or prefer / act / learn" maxlength="280" />
      <button type="submit" class="btn">Send</button>
    </form>
  </aside>

  <script src="script.js"></script>
  <script src="agent.js"></script>
  <script src="wander.js"></script>
</body>
</html>
